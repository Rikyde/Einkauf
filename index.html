<!<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spesa & Appunti</title>
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='115' fill='%2310b981'/><text x='50%' y='55%' dominant-baseline='central' text-anchor='middle' font-size='280'>🛒</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .custom-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="p-3 text-slate-800 bg-slate-100 flex justify-center min-h-screen">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-4 border border-slate-100 flex flex-col gap-5 my-auto">
    
    <!-- HEADER -->
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 bg-emerald-500 rounded-2xl flex items-center justify-center text-white text-2xl shadow-md shadow-emerald-200">
          🛒
        </div>
        <div>
          <h1 class="text-xl font-bold text-slate-900 leading-tight">Spesa & Appunti</h1>
          <p class="text-xs text-slate-500">Organizza la tua spesa in modo semplice</p>
        </div>
      </div>
      <button onclick="showNewListModal()" class="w-10 h-10 bg-emerald-500 hover:bg-emerald-600 active:scale-95 transition text-white rounded-xl flex items-center justify-center text-lg shadow-sm">
        <i class="fa-solid fa-plus"></i>
      </button>
    </div>

    <!-- TABS LISTE -->
    <div id="listsTabContainer" class="flex gap-2 overflow-x-auto custom-scrollbar py-1">
      <!-- Generate via JS -->
    </div>

    <!-- SCHEDA LISTA ATTIVA -->
    <div class="bg-slate-50/80 rounded-2xl p-4 border border-slate-100">
      <div class="flex items-center justify-between mb-1">
        <div class="flex items-center gap-2">
          <h2 id="activeListName" class="text-xl font-bold text-slate-900">Spesa Settimanale</h2>
          <button onclick="renameCurrentList()" class="text-slate-400 hover:text-slate-600 text-sm">
            <i class="fa-regular fa-pen-to-square"></i>
          </button>
        </div>
      </div>
      <p id="listProgress" class="text-xs text-slate-500 mb-3">0 di 0 elementi completati</p>
      
      <div class="flex gap-2">
        <button onclick="clearCompleted()" class="flex-1 py-2 px-3 bg-white hover:bg-slate-100 text-slate-600 text-xs font-semibold rounded-xl border border-slate-200 flex items-center justify-center gap-1.5 transition">
          <i class="fa-solid fa-broom text-slate-400"></i> Pulisci completati
        </button>
        <button onclick="deleteCurrentList()" class="py-2 px-3 bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-semibold rounded-xl border border-rose-100 flex items-center justify-center gap-1.5 transition">
          <i class="fa-regular fa-trash-can"></i> Elimina lista
        </button>
      </div>
    </div>

    <!-- FORM AGGIUNGI ELEMENTO -->
    <div class="bg-white rounded-2xl p-4 border border-slate-100 shadow-sm flex flex-col gap-3">
      <div class="flex items-center gap-2 text-emerald-600 font-bold text-sm">
        <i class="fa-solid fa-cart-plus"></i>
        <span>Aggiungi nuovo elemento</span>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">Prodotto o appunto</label>
        <input type="text" id="itemNameInput" placeholder="Es. Mele, Latte, Detersivo..." class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">Categoria</label>
        <select id="itemCategorySelect" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition">
          <option value="Frutta e Verdura">🍏 Frutta e Verdura</option>
          <option value="Carne e Pesce">🥩 Carne e Pesce</option>
          <option value="Bevande">🥤 Bevande</option>
          <option value="Latticini">🧀 Latticini</option>
          <option value="Lavorati e Snack">🍕 Lavorati e Snack</option>
          <option value="Casa e Cura">🧼 Cura Casa e Igiene</option>
          <option value="Altro" selected>📦 Altro</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">Quantità</label>
        <input type="text" id="itemQtyInput" placeholder="Es. 1kg, 2 pz, 500g" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition">
      </div>

      <button onclick="addItem()" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 active:scale-[0.98] transition text-white font-bold rounded-xl text-sm shadow-md shadow-emerald-200 flex items-center justify-center gap-2 mt-1">
        <i class="fa-solid fa-plus"></i> Aggiungi alla lista
      </button>
    </div>

    <!-- FILTRI CATEGORIE -->
    <div id="categoryFilterContainer" class="flex gap-1.5 overflow-x-auto custom-scrollbar py-1">
      <!-- Generate via JS -->
    </div>

    <!-- LISTA ELEMENTI -->
    <div id="itemsContainer" class="flex flex-col gap-2 min-h-[120px]">
      <!-- Generate via JS -->
    </div>

  </div>

  <script>
    const DEFAULT_DATA = {
      activeListId: 'list-1',
      filterCategory: 'Tutte',
      lists: [
        {
          id: 'list-1',
          name: 'Spesa Settimanale',
          items: [
            { id: '1', name: 'Mela', category: 'Frutta e Verdura', qty: '1 kg', done: false },
            { id: '2', name: 'Petto di Pollo', category: 'Carne e Pesce', qty: '500g', done: true },
            { id: '3', name: 'Acqua Naturale', category: 'Bevande', qty: '6 bottiglie', done: false },
            { id: '4', name: 'Latte Parzialmente Scremato', category: 'Latticini', qty: '2L', done: false }
          ]
        },
        {
          id: 'list-2',
          name: 'Ferramenta & Fai da Te',
          items: [
            { id: '5', name: 'Viti per Legno', category: 'Altro', qty: '1 scatola', done: false },
            { id: '6', name: 'Nastro Isolante', category: 'Altro', qty: '1 rotolo', done: false }
          ]
        }
      ]
    };

    let data = JSON.parse(localStorage.getItem('appunti_spesa_v3')) || DEFAULT_DATA;

    function saveData() {
      localStorage.setItem('appunti_spesa_v3', JSON.stringify(data));
    }

    const categories = [
      { name: 'Tutte', label: 'Tutte le categorie' },
      { name: 'Frutta e Verdura', icon: '🍏' },
      { name: 'Carne e Pesce', icon: '🥩' },
      { name: 'Bevande', icon: '🥤' },
      { name: 'Latticini', icon: '🧀' },
      { name: 'Lavorati e Snack', icon: '🍕' },
      { name: 'Casa e Cura', icon: '🧼' },
      { name: 'Altro', icon: '📦' }
    ];

    function render() {
      const activeList = data.lists.find(l => l.id === data.activeListId) || data.lists[0];
      data.activeListId = activeList.id;

      // 1. Render Tabs Liste
      const listsTab = document.getElementById('listsTabContainer');
      listsTab.innerHTML = data.lists.map(list => {
        const isActive = list.id === activeList.id;
        return `
          <button onclick="switchList('${list.id}')" class="px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap flex items-center gap-2 transition ${
            isActive 
              ? 'bg-emerald-500 text-white shadow-sm' 
              : 'bg-slate-100 hover:bg-slate-200 text-slate-600'
          }">
            <span>${list.name}</span>
            <span class="${isActive ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-600'} px-1.5 py-0.5 rounded-full text-[10px]">
              ${list.items.length}
            </span>
          </button>
        `;
      }).join('');

      // 2. Info Lista Attiva
      document.getElementById('activeListName').innerText = activeList.name;
      const completedCount = activeList.items.filter(i => i.done).length;
      document.getElementById('listProgress').innerText = `${completedCount} di ${activeList.items.length} elementi completati`;

      // 3. Render Filtri Categoria
      const catContainer = document.getElementById('categoryFilterContainer');
      catContainer.innerHTML = categories.map(cat => {
        const isSelected = data.filterCategory === cat.name;
        return `
          <button onclick="setFilter('${cat.name}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap flex items-center gap-1.5 transition ${
            isSelected 
              ? 'bg-slate-900 text-white' 
              : 'bg-slate-100 hover:bg-slate-200 text-slate-600'
          }">
            ${cat.icon ? `<span>${cat.icon}</span>` : ''}
            <span>${cat.label || cat.name}</span>
          </button>
        `;
      }).join('');

      // 4. Render Elementi
      const itemsContainer = document.getElementById('itemsContainer');
      let filteredItems = activeList.items;
      if (data.filterCategory !== 'Tutte') {
        filteredItems = activeList.items.filter(i => i.category === data.filterCategory);
      }

      if (filteredItems.length === 0) {
        itemsContainer.innerHTML = `
          <div class="text-center py-8 text-slate-400 text-xs">
            Nessun elemento presente in questa categoria.
          </div>
        `;
      } else {
        itemsContainer.innerHTML = filteredItems.map(item => {
          const catInfo = categories.find(c => c.name === item.category) || { icon: '📦' };
          return `
            <div class="flex items-center justify-between p-3 rounded-2xl border transition ${
              item.done 
                ? 'bg-slate-50 border-slate-100 text-slate-400' 
                : 'bg-white border-slate-100 shadow-sm text-slate-800'
            }">
              <div class="flex items-center gap-3 cursor-pointer select-none flex-1" onclick="toggleItem('${item.id}')">
                <div class="w-5 h-5 rounded-lg border flex items-center justify-center transition ${
                  item.done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 bg-white'
                }">
                  ${item.done ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                </div>
                <div class="flex flex-col">
                  <span class="text-sm font-semibold ${item.done ? 'line-through text-slate-400' : ''}">
                    ${item.name}
                  </span>
                  <div class="flex items-center gap-2 text-[11px] text-slate-400">
                    <span>${catInfo.icon} ${item.category}</span>
                    ${item.qty ? `<span>• ${item.qty}</span>` : ''}
                  </div>
                </div>
              </div>
              <button onclick="deleteItem('${item.id}')" class="text-slate-300 hover:text-rose-500 p-2 transition">
                <i class="fa-regular fa-trash-can text-sm"></i>
              </button>
            </div>
          `;
        }).join('');
      }
    }

    function switchList(id) {
      data.activeListId = id;
      saveData();
      render();
    }

    function showNewListModal() {
      const name = prompt("Inserisci il nome della nuova lista:");
      if (name && name.trim()) {
        const newList = {
          id: 'list-' + Date.now(),
          name: name.trim(),
          items: []
        };
        data.lists.push(newList);
        data.activeListId = newList.id;
        saveData();
        render();
      }
    }

    function renameCurrentList() {
      const activeList = data.lists.find(l => l.id === data.activeListId);
      const newName = prompt("Rinomina la lista:", activeList.name);
      if (newName && newName.trim()) {
        activeList.name = newName.trim();
        saveData();
        render();
      }
    }

    function deleteCurrentList() {
      if (data.lists.length <= 1) {
        alert("Devi mantenere almeno una lista!");
        return;
      }
      if (confirm("Sei sicuro di voler eliminare questa lista?")) {
        data.lists = data.lists.filter(l => l.id !== data.activeListId);
        data.activeListId = data.lists[0].id;
        saveData();
        render();
      }
    }

    function addItem() {
      const nameInput = document.getElementById('itemNameInput');
      const catSelect = document.getElementById('itemCategorySelect');
      const qtyInput = document.getElementById('itemQtyInput');

      const name = nameInput.value.trim();
      if (!name) return;

      const activeList = data.lists.find(l => l.id === data.activeListId);
      activeList.items.push({
        id: 'item-' + Date.now(),
        name: name,
        category: catSelect.value,
        qty: qtyInput.value.trim(),
        done: false
      });

      nameInput.value = '';
      qtyInput.value = '';
      saveData();
      render();
    }

    function toggleItem(id) {
      const activeList = data.lists.find(l => l.id === data.activeListId);
      const item = activeList.items.find(i => i.id === id);
      if (item) {
        item.done = !item.done;
        saveData();
        render();
      }
    }

    function deleteItem(id) {
      const activeList = data.lists.find(l => l.id === data.activeListId);
      activeList.items = activeList.items.filter(i => i.id !== id);
      saveData();
      render();
    }

    function clearCompleted() {
      const activeList = data.lists.find(l => l.id === data.activeListId);
      activeList.items = activeList.items.filter(i => !i.done);
      saveData();
      render();
    }

    function setFilter(cat) {
      data.filterCategory = cat;
      saveData();
      render();
    }

    render();
  </script>
</body>
</html>
